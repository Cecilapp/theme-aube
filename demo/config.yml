title: Aube for Cecil
baseline: 'A clean Bootstrap 6 theme for documentation and blogs'
baseurl: http://localhost:8000/
description: 'Demo of the Aube theme for the Cecil static site generator.'
author:
  name: Cecil
  url: 'https://cecil.app'
image: icon.png
theme:
  - flexsearch
  - aube
flexsearch:
  sections:
    docs:
      limit: 5
    blog:
      title: Posts
      limit: 3
      split: false
      date: true
menus:
  main:
    - id: docs
      name: Docs
      url: docs
      weight: 10
    - id: blog
      name: Blog
      url: blog
      weight: 20
    - id: about
      name: About
      url: about
      weight: 30
aube:
  social:
    - name: GitHub
      url: https://github.com/Cecilapp/Cecil
      icon: github
      navbar: true
    - name: Mastodon
      url: https://framapiaf.org/@cecil
      icon: mastodon
    - name: Atom feed
      url: blog/atom.xml
      icon: rss-fill
  footer:
    text: 'Code released under the MIT license.'
    columns:
      - title: Links
        links:
          - { name: Docs, url: docs }
          - { name: Blog, url: blog }
          - { name: About, url: about }
      - title: Community
        links:
          - { name: GitHub, url: 'https://github.com/Cecilapp/Cecil' }
          - { name: Discussions, url: 'https://github.com/Cecilapp/Cecil/discussions' }
